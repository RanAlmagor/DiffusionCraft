<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefusionCraft | Your Gallery</title>

    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Fonts & Styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/image-card.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body class="bg-black text-gray-200 font-orbitron">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main -->
    <div class="container mx-auto px-6 py-8">
      <h2 class="section-title" style="margin-left: 300px">Personal Gallery</h2>

      <!-- Gallery Section -->
      <section
        id="gallery"
        class="grid gap-6 sm:grid-cols-2 md:grid-cols-3"
      ></section>

      <!-- Zoom Modal -->
      <div id="zoom-modal" class="hidden">
        <div style="text-align: center">
          <img id="zoom-image" src="#" alt="Zoomed Image" />
          <div id="zoom-description"></div>
        </div>
        <button id="close-modal">✖ Close</button>
      </div>

      <!-- Chat -->
      <div id="chat-container" class="chat-wrapper mt-12"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2025 DefusionCraft. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/login-handler.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>
    <script src="js/delete-image.js"></script>
    <script src="js/Personalgallery-loader.js"></script>
  </body>
</html>
