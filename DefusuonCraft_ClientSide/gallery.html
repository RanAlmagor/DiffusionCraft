<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefusionCraft | Your Gallery</title>

    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Fonts & Styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/image-card.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body class="bg-black text-gray-200 font-orbitron">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main -->
    <div class="container mx-auto px-6 py-8">
      <h2 class="section-title" style="margin-left: 300px">Personal Gallery</h2>

      <!-- Gallery Section -->
      <section
        id="gallery"
        class="grid gap-6 sm:grid-cols-2 md:grid-cols-3"
      ></section>

      <!-- Zoom Modal -->
      <div
        id="zoom-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-4"
      >
        <div class="text-center">
          <button
            id="close-modal"
            class="absolute top-4 right-4 bg-cyan-300 text-black px-4 py-2 rounded"
          >
            ✖
          </button>
          <img
            id="zoom-image"
            src="#"
            alt="Zoomed Image"
            class="max-w-full max-h-[70vh] mx-auto rounded"
          />
          <p
            id="zoom-description"
            class="mt-4 text-cyan-300 max-w-2xl mx-auto overflow-y-auto max-h-[20vh] p-2"
          ></p>
        </div>
      </div>

      <!-- Chat -->
      <div id="chat-container" class="chat-wrapper mt-12"></div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-sm mt-16 border-t border-gray-800 pt-4">
      &copy; 2025 DefusionCraft. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/login-handler.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>
    <script src="js/delete-image.js"></script>
    <script src="js/Personalgallery-loader.js"></script>
  </body>
</html>
