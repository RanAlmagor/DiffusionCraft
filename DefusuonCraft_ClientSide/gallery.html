<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefusionCraft | Your Gallery</title>

    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Fonts & Styles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/image-card.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body class="bg-black text-gray-200 font-orbitron">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main -->
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- כותרת מרוכזת ורספונסיבית -->
      <h2 class="section-title mx-auto w-fit">Personal Gallery</h2>

      <!-- Gallery Section -->
      <section
        id="gallery"
        class="mt-8 grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
      ></section>

      <!-- Zoom Modal -->
      <div
        id="zoom-modal"
        class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50"
      >
        <div class="text-center">
          <img
            id="zoom-image"
            class="max-w-full max-h-[80vh] rounded-lg shadow-xl border-2 border-teal-400"
            src="#"
            alt="Zoomed Image"
          />
          <div
            id="zoom-description"
            class="mt-4 p-4 max-h-[20vh] overflow-y-auto text-sm bg-black/50 backdrop-blur-md rounded-lg text-teal-200"
          ></div>
        </div>
        <button
          id="close-modal"
          class="absolute top-4 right-4 bg-teal-400 text-black px-3 py-1 rounded-lg shadow-lg hover:bg-teal-300 transition"
        >
          ✖ Close
        </button>
      </div>

      <!-- Chat -->
      <div id="chat-container" class="chat-wrapper mt-12"></div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center py-4 text-sm text-gray-500">
      &copy; 2025 DefusionCraft. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/login-handler.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>
    <script src="js/delete-image.js"></script>
    <script src="js/Personalgallery-loader.js"></script>
  </body>
</html>
