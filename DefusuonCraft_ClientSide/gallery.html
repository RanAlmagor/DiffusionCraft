<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefusionCraft | Your Gallery</title>

    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Orbitron Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/gallery.css" />
    <link rel="stylesheet" href="css/image-card.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body class="bg-black text-gray-200 font-orbitron">
    <!-- Navbar (Loaded dynamically) -->
    <div id="navbar-container"></div>

    <!-- Page Container -->
    <div class="container mx-auto px-6 py-8">
      <!-- Title -->
      <h2 class="section-title text-center">Your Personal Gallery</h2>

      <!-- Gallery -->
      <section class="gallery" id="gallery"></section>

      <!-- Chat Container -->
      <div id="chat-container" class="chat-wrapper mt-12"></div>
    </div>

    <!-- Footer -->
    <footer
      class="footer text-center text-sm mt-16 border-t border-gray-800 pt-4"
    >
      &copy; 2025 DefusionCraft. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/login-handler.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>
    <script src="js/Personalgallery-loader.js"></script>
  </body>
</html>
