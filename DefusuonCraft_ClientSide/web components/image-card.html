<div class="image-card">
  <!-- תמונה ראשית -->
  <img
    src="#"
    alt="Generated Image"
    class="w-full h-60 object-cover border-b border-cyan-300/20"
  />

  <!-- מטא-דאטה על המשתמש והתאריך -->
  <div class="image-meta">
    <div><strong>User:</strong> <span class="image-user"></span></div>
    <div><strong>Created:</strong> <span class="image-created"></span></div>
  </div>

  <!-- כפתורים -->
  <div class="image-actions">
    <button class="btn-share">🚀 SHARE</button>
    <button class="btn-download">💾 DOWNLOAD</button>
  </div>
</div>
