<!-- Gemini Chat Bubble + Window -->
<div id="gemini-bubble" class="gemini-bubble hidden" onclick="toggleChat()">
  💬
</div>

<div id="chat-box" class="chat-box hidden">
  <div class="chat-header">
    DefusionCraft Assistant
    <button onclick="toggleChat()">✖</button>
  </div>
  <div class="chat-body">
    <div class="chat-log" id="chat-messages"></div>

    <input
      type="text"
      id="chat-input"
      placeholder="Ask something..."
      onkeydown="handleKey(event)"
    />

    <!-- עטיפת הכפתורים לשורה אחת -->
    <div id="voice-buttons-container">
      <button
        id="voice-input-btn"
        onclick="startVoiceInput()"
        title="Voice Input"
      >
        🎤
      </button>
      <button
        id="voice-output-btn"
        onclick="speakMessage()"
        title="Voice Output"
      >
        🔊
      </button>
    </div>
  </div>
</div>
