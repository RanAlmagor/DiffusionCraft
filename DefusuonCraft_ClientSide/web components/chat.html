<!-- === Gemini Chat Bubble and Window === -->

<!-- Floating Chat Bubble -->
<div id="gemini-bubble" class="gemini-bubble hidden" onclick="toggleChat()">
  💬
</div>

<!-- Chat Window -->
<div id="chat-box" class="chat-box hidden">
  <!-- Chat Header -->
  <div class="chat-header">
    DefusionCraft Assistant
    <button onclick="toggleChat()" title="Close Chat">✖</button>
  </div>

  <!-- Chat Body -->
  <div class="chat-body">
    <!-- Chat Messages -->
    <div id="chat-messages" class="chat-log"></div>

    <!-- Input Field -->
    <input
      id="chat-input"
      type="text"
      placeholder="Ask something magical..."
      onkeydown="handleKey(event)"
    />

    <!-- Voice Controls -->

    <div id="voice-buttons-container">
      <!-- Voice Selector Dropdown -->
      <select id="voice-selector" title="Choose Voice">
        <option>Loading voices...</option>
      </select>
      <!-- Test Voice Button -->
      <button
        id="test-voice-btn"
        onclick="testSelectedVoice()"
        title="Test Voice"
      >
        🧪
      </button>

      <!-- Voice Input -->
      <button
        id="voice-input-btn"
        onclick="startVoiceInput()"
        title="Speak to Chat"
      >
        🎤
      </button>
    </div>
  </div>
</div>
