<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | DefusionCraft</title>

    <!-- Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Orbitron Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAVBAR אופקי -->
    <header class="navbar">
      <div class="navbar-title">DefusionCraft Management ⚡</div>
      <nav class="navbar-nav">
        <a
          id="link-dashboard"
          href="index.html"
          class="nav-link dashboard"
          title="Dashboard"
        ></a>
        <a
          id="link-users"
          href="javascript:void(0);"
          class="nav-link users"
          title="Users"
        ></a>
        <a
          id="link-images"
          href="javascript:void(0);"
          class="nav-link images"
          title="Images"
        ></a>
      </nav>
    </header>

    <div class="main-wrapper">
      <!-- MAIN CONTENT -->
      <main class="main-content">
        <header class="admin-header">
          <h1>Welcome, Admin</h1>
        </header>

        <!-- USER MANAGEMENT -->
        <section id="user-management" class="hidden section">
          <h2>User Management</h2>
          <div class="table-wrapper">
            <table class="styled-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Group</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="user-list"></tbody>
            </table>
          </div>
        </section>

        <!-- IMAGE MANAGEMENT -->
        <section id="image-management" class="hidden section">
          <h2>Manage Images</h2>
          <div class="table-wrapper">
            <table class="styled-table">
              <thead>
                <tr>
                  <th>Thumbnail</th>
                  <th>Prompt</th>
                  <th>User</th>
                  <th>Created</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="image-list"></tbody>
            </table>
          </div>
          <div id="pager" class="pager"></div>
        </section>
      </main>
    </div>

    <!-- ZOOM MODAL -->
    <div id="zoom-modal" class="zoom-modal hidden">
      <img id="zoom-img" alt="Zoomed Image" />
    </div>

    <footer class="footer">
      <p>&copy; 2025 DefusionCraft • All rights reserved.</p>
    </footer>

    <!-- Logic -->
    <script src="js/admin.js"></script>
  </body>
</html>
