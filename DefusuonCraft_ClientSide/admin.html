<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | DefusionCraft</title>

    <!-- Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Orbitron Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Main Admin Container -->
    <div class="admin-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
          <li><a href="index.html">Dashboard</a></li>
          <li>
            <a
              href="javascript:void(0);"
              onclick="showSection('user-management')"
              >User Management</a
            >
          </li>
          <li>
            <a
              href="javascript:void(0);"
              onclick="showSection('image-management')"
              >Image Management</a
            >
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="admin-header">
          <h1>Welcome, Admin</h1>
        </header>

        <!-- USER MANAGEMENT -->
        <section id="user-management" class="hidden">
          <h2>User Management</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-800 rounded-lg shadow-lg">
              <thead>
                <tr>
                  <th class="px-4 py-2 text-left text-white">Username</th>
                  <th class="px-4 py-2 text-left text-white">Group</th>
                  <th class="px-4 py-2 text-left text-white">Actions</th>
                </tr>
              </thead>
              <tbody id="user-list"></tbody>
            </table>
          </div>
        </section>

        <!-- IMAGE MANAGEMENT -->
        <section id="image-management" class="hidden">
          <h2>Manage Images</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-800 rounded-lg shadow-lg">
              <thead>
                <tr>
                  <th class="px-4 py-2 text-left text-white">Image Name</th>
                  <th class="px-4 py-2 text-left text-white">Date Uploaded</th>
                  <th class="px-4 py-2 text-left text-white">Actions</th>
                </tr>
              </thead>
              <tbody id="image-list"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>&copy; 2025 DefusionCraft • All rights reserved.</p>
    </footer>

    <!-- Logic -->
    <script src="js/admin.js"></script>
  </body>
</html>
