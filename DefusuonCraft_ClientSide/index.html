<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefusionCraft Web</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/image-card.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>

  <body>
    <!-- Navbar -->
    <div id="navbar-container"></div>
    <div
      id="success-toast"
      class="hidden fixed bottom-6 right-6 bg-black/80 text-lime-300 px-6 py-4 rounded-2xl shadow-2xl text-lg font-semibold z-50 animate-fade-in"
    >
      ✅ Prompt updated successfully!
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <h2 class="section-title" style="margin-left: 300px">
        Explore AI-Generated Art
      </h2>
      <div class="gallery" id="gallery"></div>

      <!-- Chat Container (ממוקם בתוך main לזרימה ריספונסיבית) -->
      <div id="chat-container" class="chat-wrapper"></div>
    </main>

    <!-- Zoom Modal -->
    <div id="zoom-modal" class="hidden">
      <div style="text-align: center">
        <img id="zoom-image" src="#" alt="Zoomed Image" />
        <div id="zoom-description"></div>
      </div>
      <button id="close-modal">✖ Close</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2025 DefusionCraft. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/login-handler.js"></script>
    <script src="js/Homegallery-loader.js"></script>
    <script type="module" src="js/chat-loader.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>
  </body>
</html>
